[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igcd"
version = "0.1.0"
description = "Automated pipeline for building the Indian Glacier Change Dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "earthengine-api",
  "geemap",
  "geopandas",
  "numpy",
  "pandas",
  "opencv-python",
  "scikit-image",
  "scipy",
  "rasterio",
  "shapely",
  "matplotlib",
  "tqdm",
  "pyproj",
  "fiona",
  "ipywidgets"
]

[tool.setuptools.packages.find]
include = ["igcd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
