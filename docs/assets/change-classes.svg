<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-labelledby="title desc">
  <title id="title">IGCD change map classes</title>
  <desc id="desc">Four labels used in glacier change masks: background, stable glacier, retreat, and advance.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #1f2937; stroke-width: 1.2; rx: 10; }
      .title { font: 600 17px Arial, sans-serif; fill: #111827; }
      .text { font: 400 13px Arial, sans-serif; fill: #4b5563; }
      .swatch { stroke: #111827; stroke-width: 1; rx: 6; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="880" height="170"/>
  <rect class="card" x="25" y="30" width="190" height="110"/>
  <rect class="swatch" x="45" y="52" width="42" height="42" fill="#000000"/>
  <text class="title" x="105" y="67">0 Background</text>
  <text class="text" x="105" y="91">non-glacier</text>
  <rect class="card" x="240" y="30" width="190" height="110"/>
  <rect class="swatch" x="260" y="52" width="42" height="42" fill="#00aaff"/>
  <text class="title" x="320" y="67">1 Stable</text>
  <text class="text" x="320" y="91">glacier in t1 and t2</text>
  <rect class="card" x="455" y="30" width="190" height="110"/>
  <rect class="swatch" x="475" y="52" width="42" height="42" fill="#ff5050"/>
  <text class="title" x="535" y="67">2 Retreat</text>
  <text class="text" x="535" y="91">glacier in t1 only</text>
  <rect class="card" x="670" y="30" width="190" height="110"/>
  <rect class="swatch" x="690" y="52" width="42" height="42" fill="#50dc78"/>
  <text class="title" x="750" y="67">3 Advance</text>
  <text class="text" x="750" y="91">glacier in t2 only</text>
</svg>
