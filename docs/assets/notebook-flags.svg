<svg xmlns="http://www.w3.org/2000/svg" width="980" height="260" viewBox="0 0 980 260" role="img" aria-labelledby="title desc">
  <title id="title">Notebook flag sequence</title>
  <desc id="desc">Three notebook runs: Sentinel export, mask export, and local processing.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 1.3; rx: 12; }
      .head { font: 600 18px Arial, sans-serif; fill: #111827; }
      .mono { font: 400 13px monospace; fill: #1f2937; }
      .true { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4; }
      .false { fill: #fee2e2; stroke: #dc2626; stroke-width: 1; rx: 4; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="260"/>
  <rect class="panel" x="25" y="35" width="275" height="180"/>
  <text class="head" x="45" y="66">Run 1: Sentinel</text>
  <rect class="true" x="45" y="88" width="210" height="24"/>
  <text class="mono" x="55" y="105">RUN_SENTINEL_EXPORTS=True</text>
  <rect class="false" x="45" y="120" width="185" height="24"/>
  <text class="mono" x="55" y="137">RUN_MASK_EXPORTS=False</text>
  <text class="mono" x="45" y="170">wait for Drive exports</text>
  <path class="arrow" d="M 305 125 H 345"/>
  <rect class="panel" x="350" y="35" width="275" height="180"/>
  <text class="head" x="370" y="66">Run 2: Masks</text>
  <rect class="false" x="370" y="88" width="215" height="24"/>
  <text class="mono" x="380" y="105">RUN_SENTINEL_EXPORTS=False</text>
  <rect class="true" x="370" y="120" width="180" height="24"/>
  <text class="mono" x="380" y="137">RUN_MASK_EXPORTS=True</text>
  <text class="mono" x="370" y="170">wait for mask exports</text>
  <path class="arrow" d="M 630 125 H 670"/>
  <rect class="panel" x="675" y="35" width="280" height="180"/>
  <text class="head" x="695" y="66">Run 3: Local outputs</text>
  <rect class="true" x="695" y="88" width="185" height="24"/>
  <text class="mono" x="705" y="105">RUN_SYNC_EXPORTS=True</text>
  <rect class="true" x="695" y="120" width="205" height="24"/>
  <text class="mono" x="705" y="137">RUN_CHANGE_MASKS=True</text>
  <rect class="true" x="695" y="152" width="175" height="24"/>
  <text class="mono" x="705" y="169">RUN_QC=True</text>
  <rect class="true" x="695" y="184" width="215" height="24"/>
  <text class="mono" x="705" y="201">RUN_PACKAGING=True</text>
</svg>
